# =============================================================================
# Parametrage des copies production -> environnements de test
# =============================================================================
# Format (une regle par ligne, champs separes par | ) :
#
#   dossier source | dossier cible | critere | masque (optionnel) | recursif (optionnel)
#
# critere  : J      = fichiers modifies depuis aujourd'hui 00h00
#            J-1    = depuis hier 00h00
#            J-N    = depuis il y a N jours a 00h00
#            TOUT   = sans filtre de date
# masque   : un ou plusieurs motifs separes par ;  (defaut : *)
#            ex : *.csv   ou   FACT_*.xml;FACT_*.pdf
# recursif : oui / non (defaut : non). Si oui, l'arborescence est reproduite.
#
# Chemins locaux ou UNC acceptes. Variables d'environnement %VAR% acceptees.
# Les lignes vides et celles commencant par # sont ignorees.
# =============================================================================

# --- Recette ---
\\SRV-PROD01\exports\factures   | \\SRV-RECETTE01\imports\factures | J-1 | *.csv
\\SRV-PROD01\exports\factures   | \\SRV-RECETTE01\imports\pdf      | J-1 | FACT_*.pdf
\\SRV-PROD01\exports\clients    | \\SRV-RECETTE01\imports\clients  | J   | *.xml;*.json

# --- Qualification ---
\\SRV-PROD01\exports\factures   | \\SRV-QUALIF01\imports\factures  | J-2 | *.csv
D:\Prod\Archives\Mensuel        | \\SRV-QUALIF01\archives          | J-7 | *    | oui
